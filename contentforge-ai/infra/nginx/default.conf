# ==============================================================================
# ContentForge AI - Production Nginx Reverse Proxy Configuration
# ==============================================================================

upstream frontend_app {
    server frontend:3000;
}

upstream backend_api {
    server backend:8000;
}

upstream grafana_ui {
    server grafana:3000;
}

upstream flower_ui {
    server flower:5555;
}

# 1. HTTP Server - Redirect to HTTPS and support Certbot ACME challenge
server {
    listen 80;
    server_name _;
    client_max_body_size 25M;

    # Let's Encrypt Certbot HTTP Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # In production with TLS enabled, redirect HTTP to HTTPS
    # Uncomment the following line when certificates are provisioned:
    # return 301 https://$host$request_uri;

    # Temporary HTTP proxy pass before TLS certificates are generated:
    include /etc/nginx/conf.d/proxy_rules.inc;
}

# 2. HTTPS Server - TLS Termination & Hardened Security Headers
server {
    listen 443 ssl http2;
    server_name _;
    client_max_body_size 25M;

    # SSL Certificates (Path mapped via Docker volumes for Certbot or self-signed)
    ssl_certificate /etc/nginx/ssl/live/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;

    # TLS Protocols & Cipher Suites (Modern Security Profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Strict Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:;" always;

    include /etc/nginx/conf.d/proxy_rules.inc;
}
