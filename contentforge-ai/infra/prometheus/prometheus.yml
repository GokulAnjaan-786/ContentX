global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "contentforge-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          app: "contentforge-backend"
          env: "production"

  - job_name: "celery-flower"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["flower:5555"]
        labels:
          app: "contentforge-celery"
          env: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
